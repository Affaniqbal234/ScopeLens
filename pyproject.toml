[project]
name = "scopelens"
version = "0.1.0"
description = "Authorized security assessment tooling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "pydantic>=2.13.5,<3",
]

[project.scripts]
scopelens = "scopelens.cli:main"

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-defusedxml>=0.7.0.20260504",
]
