name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
      - name: Install Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build
      - name: Verify controlled Docker lab
        if: runner.os == 'Linux'
        env:
          SCOPELENS_LAB_TEST: "1"
        run: uv run --locked pytest tests/test_lab.py
      - name: Check installed wheel entry points
        run: |
          uv run --isolated --no-project --with ./dist/*.whl scopelens --version
          uv run --isolated --no-project --with ./dist/*.whl python -m scopelens --help
